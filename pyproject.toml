[build-system]
requires = [
    "setuptools>=77.0.3",
    "wheel>=0.45",
    "Cython>=3.0.8",
    "swig>=4.4.1",
    # NumPy is required at build time for wheel generation.
    # Building against NumPy 2.x produces wheels compatible with NumPy 1.x at runtime.
    "numpy>=2.0.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "SERD"
description = "A Python package to detect solvent-exposed residues of a target biomolecule."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10, <4"
license = { file = "LICENSE" }
authors = [
    { name = "João V. S. Guerra", email = "jvsguerra@gmail.com" },
    { name = "Gabriel E. Jara" },
    { name = "José G. C. Pereira" },
    { name = "Helder V. Ribeiro-Filho" },
]
maintainers = [{ name = "João V. S. Guerra", email = "jvsguerra@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "networkx>=3.4.0,<3.7.0",
    "numpy>=2.0.0,<2.5.0",
    "pyKVFinder>=0.9.0,<0.10.0",
    "scipy>=1.14.0,<1.19.0",
]
dynamic = ["version"]
keywords = [
    "structural biology",
    "proteins",
    "biomolecular surface",
    "solvent-exposed residues",
]

[project.urls]
homepage = "https://github.com/LBC-LNBio/SERD"
documentation = "https://lbc-lnbio.github.io/SERD/ "
issues = "https://github.com/LBC-LNBio/SERD/issues"

[tool.setuptools]
packages = ["SERD"]
include-package-data = true
py-modules = ["_SERD"]

[tool.setuptools.dynamic]
version = { attr = "SERD.__version__" }

[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
test-skip = "*"

[tool.cibuildwheel.linux]
archs = ["native"]

[tool.cibuildwheel.macos]
before-build = [
    "python3 -m pip install --upgrade pip",
    "pip3 install certifi",
    "git clean -fxd build",
    "brew install llvm",
    "brew install libomp",
]
archs = ["native"]

[tool.cibuildwheel.windows]
archs = ["native"]
